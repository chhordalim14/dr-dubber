name: Tests

on:
  push:
  pull_request:

# Tests only need to read the code.
permissions:
  contents: read

jobs:
  test:
    # The app ships for Windows first, and some tests only run on win32.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The tests don't launch Electron; skip the ~100 MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Syntax-check main and backend entry points
        run: |
          node --check main.js
          node --check backend/server.js
          node --check preload.js

      - name: Run tests
        run: npm test
